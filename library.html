<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UustBook — Библиотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="book-open-cover.png" alt="UustBook logo">
      <h1>UustBook</h1>
    </div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="groups.html">Сообщества</a>
      <a href="library.html" class="active">Библиотека</a>
    </nav>
    <div class="user-info" id="userInfo" style="display: none;">
      <span id="userName"></span>
      <button onclick="logout()" class="logout-btn">Выйти</button>
    </div>
  </header>

  <main class="content">
    <h2 style="color: white;">Библиотека</h2>
    <input type="text" id="searchInput" placeholder="Поиск..." class="search-input">

    <table class="library-table">
      <thead>
        <tr><th>Название</th><th>Размер</th><th>Скачивания</th><th></th></tr>
      </thead>
      <tbody id="materialsList">
        <tr><td colspan="4" style="text-align: center;">Загрузка...</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>© 2026 UustBook</p>
  </footer>

  <script src="database.js"></script>
  <script>
    let currentUser = null;

    window.onload = async function() {
      if (db && typeof db.waitForReady === 'function') {
        await db.waitForReady();
      }
      
      console.log('База данных готова, загружаем библиотеку...');
      
      currentUser = db.getCurrentUser();
      
      if (currentUser) {
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('userName').textContent = currentUser.fullname;
      }
      
      await loadMaterials();
      
      document.getElementById('searchInput').addEventListener('input', loadMaterials);
    };
    
    async function loadMaterials() {
      try {
        const query = document.getElementById('searchInput').value;
        const materials = await db.searchMaterials(query);
        
        const tbody = document.getElementById('materialsList');
        
        if (!materials || materials.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Материалы не найдены</td></tr>';
          return;
        }
        
        tbody.innerHTML = '';
        
        for (const material of materials) {
          const row = tbody.insertRow();
          row.insertCell(0).textContent = material.title;
          row.insertCell(1).textContent = material.size;
          row.insertCell(2).textContent = material.downloads || 0;
          
          const downloadCell = row.insertCell(3);
          const downloadBtn = document.createElement('button');
          downloadBtn.textContent = '📥 Скачать';
          
          // Привязываем конкретные файлы к конкретным материалам
          downloadBtn.onclick = () => downloadMaterial(material);
          downloadCell.appendChild(downloadBtn);
        }
      } catch (error) {
        console.error('Ошибка загрузки материалов:', error);
        document.getElementById('materialsList').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Ошибка загрузки материалов</td></tr>';
      }
    }
    
    async function downloadMaterial(material) {
      try {
        // Определяем какой файл скачивать в зависимости от ID материала
        let fileToDownload = '';
        
        if (material.id === 1) {
          fileToDownload = '1.txt';
        } else if (material.id === 2) {
          fileToDownload = '2.txt';
        } else {
          // Для остальных материалов (если есть) - тоже 1.txt по умолчанию
          fileToDownload = '1.txt';
        }
        
        // Увеличиваем счетчик скачиваний
        await db.downloadMaterial(material.id);
        
        // Создаем ссылку для скачивания
        const link = document.createElement('a');
        link.href = fileToDownload;
        link.download = fileToDownload;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log(`Скачивание файла ${fileToDownload} для материала ${material.title}`);
        
        // Обновляем счетчик на странице
        await loadMaterials();
        
      } catch (error) {
        console.error('Ошибка скачивания:', error);
        alert('Ошибка при скачивании файла');
      }
    }
    
    async function logout() {
      db.logout();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
