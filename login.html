<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UustBook — Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="book-open-cover.png" alt="UustBook logo">
      <h1>UustBook</h1>
    </div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="groups.html">Сообщества</a>
      <a href="library.html">Библиотека</a>
    </nav>
  </header>

  <main class="content">
    <div class="auth-form">
      <h2>Вход в аккаунт</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Войти</button>
      </form>
      <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      <p style="margin-top: 10px; font-size: 14px; color: #666;">Тестовый доступ: test@example.com / 123456</p>
      <div id="debugInfo" style="margin-top: 10px; font-size: 12px; color: #999;"></div>
    </div>
  </main>

  <footer>
    <p>© 2026 UustBook</p>
  </footer>

  <script src="database.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const debugDiv = document.getElementById('debugInfo');
      
      debugDiv.textContent = 'Проверка...';
      
      try {
        // Ждем готовности базы данных
        await db.waitForReady();
        
        debugDiv.textContent = 'База данных готова, выполняем вход...';
        
        const user = await db.loginUser(email, password);
        debugDiv.textContent = 'Вход выполнен! Перенаправление...';
        
        alert('Вход выполнен успешно!');
        window.location.href = 'index.html';
      } catch (error) {
        debugDiv.textContent = 'Ошибка: ' + error.message;
        alert('Ошибка: ' + error.message);
      }
    });
  </script>
</body>
</html>
