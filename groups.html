<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UustBook — Социальные группы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="book-open-cover.png" alt="UustBook logo">
      <h1>UustBook</h1>
    </div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="groups.html" class="active">Сообщества</a>
      <a href="library.html">Библиотека</a>
    </nav>
    <div class="user-info" id="userInfo" style="display: none;">
      <span id="userName"></span>
      <button onclick="logout()" class="logout-btn">Выйти</button>
    </div>
  </header>

  <main class="content">
    <h2 style="color: white;">Социальные группы</h2>
    <p id="userStatus" style="color: rgb(255, 242, 0);"></p>

    <div id="groupsContainer">
      <table class="group-table">
        <thead>
          <tr><th>Название группы</th><th>Участники</th><th>Сообщения</th><th>Описание</th><th></th></tr>
        </thead>
        <tbody id="groupsList">
          <tr><td colspan="5" style="text-align: center;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>© 2026 UustBook</p>
  </footer>

  <script src="database.js"></script>
  <script>
    let currentUser = null;
    let userGroups = [];

    window.onload = async function() {
      // Ждем готовности базы данных
      await db.waitForReady();
      console.log('База данных готова, загружаем группы...');
      
      currentUser = db.getCurrentUser();
      
      if (currentUser) {
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('userName').textContent = currentUser.fullname;
        document.getElementById('userStatus').textContent = 'Вы можете вступать в группы';
        userGroups = await db.getUserGroups(currentUser.id);
        console.log('Группы пользователя:', userGroups);
      } else {
        document.getElementById('userStatus').innerHTML = 'Для вступления в группы <a href="login.html" style="color: #ffd700;">войдите</a> в аккаунт';
      }
      
      await loadGroups();
    };
    
    async function loadGroups() {
      try {
        const groups = await db.getAll('groups');
        console.log('Загружены группы:', groups);
        
        const tbody = document.getElementById('groupsList');
        
        if (!groups || groups.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Группы не найдены</td></tr>';
          return;
        }
        
        tbody.innerHTML = '';
        
        for (const group of groups) {
          const isMember = currentUser && userGroups.some(g => g.id === group.id);
          
          const row = tbody.insertRow();
          row.insertCell(0).textContent = group.name;
          row.insertCell(1).textContent = group.members;
          row.insertCell(2).textContent = group.messages;
          row.insertCell(3).textContent = group.description;
          
          const actionCell = row.insertCell(4);
          
          if (isMember) {
            const chatBtn = document.createElement('button');
            chatBtn.textContent = 'Перейти в чат';
            chatBtn.style.background = '#28a745';
            chatBtn.onclick = () => window.location.href = `group-chat.html?id=${group.id}`;
            actionCell.appendChild(chatBtn);
          } else if (currentUser) {
            const joinBtn = document.createElement('button');
            joinBtn.textContent = 'Вступить';
            joinBtn.onclick = () => joinGroup(group.id);
            actionCell.appendChild(joinBtn);
          } else {
            const loginBtn = document.createElement('button');
            loginBtn.textContent = 'Войти';
            loginBtn.style.background = '#6c757d';
            loginBtn.onclick = () => window.location.href = 'login.html';
            actionCell.appendChild(loginBtn);
          }
        }
      } catch (error) {
        console.error('Ошибка загрузки групп:', error);
        document.getElementById('groupsList').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Ошибка загрузки групп</td></tr>';
      }
    }
    
    async function joinGroup(groupId) {
      if (!currentUser) {
        alert('Войдите в аккаунт');
        window.location.href = 'login.html';
        return;
      }
      
      try {
        await db.joinGroup(currentUser.id, groupId);
        alert('Вы вступили в группу!');
        userGroups = await db.getUserGroups(currentUser.id);
        await loadGroups();
      } catch (error) {
        alert(error.message);
      }
    }
    
    async function logout() {
      db.logout();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
