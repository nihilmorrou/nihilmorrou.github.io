      font-size: 16px;
      background: white;

    .materials-table {

      background: white;

    }
    
    .materials-table table {
      width: 100%;

    }

      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }

    }
    
    .materials-table tr:hover {

    }
    
    .download-btn {
      background: #2a63ff;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    
    .download-btn:hover {

    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #ffd700;
      text-decoration: none;
    }
    
    .back-link:hover {

    .no-materials {

      padding: 10px 15px;

    // Загружаем сохраненные счетчики скачиваний из localStorage
    function loadDownloads() {
      const saved = localStorage.getItem('materialDownloads');
      if (saved) {
        const downloads = JSON.parse(saved);
        for (let i = 0; i < materialsData.length; i++) {
          if (downloads[i]) {
            materialsData[i].downloads = downloads[i];
          }
        }
      }
    }
    
    // Сохраняем счетчики скачиваний
    function saveDownloads() {
      const downloads = materialsData.map(m => m.downloads);
      localStorage.setItem('materialDownloads', JSON.stringify(downloads));
    }
    
    // Отображение материалов
    function displayMaterials(faculty) {
      const tbody = document.getElementById('materialsBody');
      tbody.innerHTML = '';
      
      let filteredMaterials;
      if (faculty === '') {
        filteredMaterials = materialsData;
      } else {
        filteredMaterials = materialsData.filter(m => m.faculty === faculty);
      }
      
      if (filteredMaterials.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="no-materials">Нет материалов для выбранного факультета</td></tr>';
        return;
      }
      
      for (let i = 0; i < filteredMaterials.length; i++) {
        const material = filteredMaterials[i];
        const originalIndex = materialsData.findIndex(m => m.title === material.title && m.faculty === material.faculty);
        
        const row = tbody.insertRow();
        row.insertCell(0).textContent = material.title;
        row.insertCell(1).textContent = material.faculty;
        row.insertCell(2).textContent = material.size;
        
        const downloadsCell = row.insertCell(3);
        downloadsCell.textContent = material.downloads;
        downloadsCell.className = 'downloads-count';
        
        const actionCell = row.insertCell(4);
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Скачать';
        downloadBtn.className = 'download-btn';
        downloadBtn.onclick = (function(idx) {
          return function() { downloadMaterial(idx); };
        })(originalIndex);
        actionCell.appendChild(downloadBtn);
      }
    }
    
    // Функция скачивания
    function downloadMaterial(index) {
      materialsData[index].downloads++;
      saveDownloads();
      
      const faculty = document.getElementById('facultySelect').value;
      displayMaterials(faculty);
      
      alert(`Скачивание материала "${materialsData[index].title}" началось!\nВсего скачиваний: ${materialsData[index].downloads}`);
    }
    
    // Обработчик выбора факультета
    document.getElementById('facultySelect').addEventListener('change', function() {
      displayMaterials(this.value);
    });
    
    // Инициализация
    loadDownloads();
    displayMaterials('');
  </script>
